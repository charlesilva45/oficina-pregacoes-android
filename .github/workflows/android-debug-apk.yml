name: Gerar APK de testes
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar Android SDK do runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo 'Android SDK ausente'; exit 1; }
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de testes
        run: gradle --no-daemon :app:assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: OficinaPregacoes-0.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
